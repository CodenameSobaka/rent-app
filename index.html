<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Аренда Квартир</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Поиск аренды</h1>
    <div id="auth-section">
      <button onclick="showLogin()">Войти</button>
      <button onclick="showRegister()">Регистрация</button>
    </div>
  </header>

  <!-- Форма создания объявления (показывать только авторизованным) -->
  <div id="create-form" style="display:none;">
    <h2>Разместить объявление</h2>
    <!-- Поля формы: title, city, price и т.д. -->
    <button onclick="createListing()">Опубликовать</button>
  </div>

  <div class="filters">...</div>
  <div id="results" class="cards"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
